[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "json-log-inspector"
version = "0.1.0"
description = "Summarize JSON Lines application logs with level counts, latency percentiles and top errors."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
json-log-inspector = "log_inspector.core:main"

[tool.setuptools.packages.find]
include = ["log_inspector*"]
